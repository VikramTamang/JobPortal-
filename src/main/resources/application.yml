spring:
  application:
    name: job-portal

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/jobportal
    username: jobportal
    password: jobportal_dev_pw
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate should only validate it matches.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  storage:
    mode: local          # local | s3
    local:
      base-path: ./uploads
    s3:
      endpoint: http://localhost:9000
      bucket: jobportal-resumes
      access-key: jobportal
      secret-key: jobportal_dev_pw
      region: us-east-1
  cors:
    allowed-origins: "http://localhost:3000"
  rate-limit:
    requests-per-minute: 60

logging:
  level:
    com.jobportal: DEBUG
    org.hibernate.SQL: DEBUG